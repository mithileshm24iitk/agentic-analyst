# Runs the offline unit test suite on every push and pull request.
# Note: The live evaluation harness (make eval / make eval-smoke / make eval-retrieval)
# is intentionally NOT run in CI because it requires Google Cloud credentials
# (Vertex AI Gemini + Embeddings and BigQuery billing project access).

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies in .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          make install

      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q app agents tools eval tests

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Validate Dockerfile syntax
        run: docker build --check .

      - name: Run unit tests (no GCP access needed)
        run: make test
